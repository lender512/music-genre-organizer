[project]
name = "music-genre-organizer"
version = "0.1.0"
description = "CLI tool to organize your saved music library by genre using Last.fm tags."
readme = "README.md"
authors = [
    { name = "Luis Berrospi", email = "luis.berrospi@utec.edu.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "spotipy>=2.26.0",
]

[project.scripts]
music-genre-organizer = "music_genre_organizer:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
